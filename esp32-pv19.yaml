    value_type: U_WORD
    internal: True

  # Número para configurar a capacidade do banco de baterias via Home Assistant
  # O valor é persistido no global 'battery_capacity_ah' acima
  - platform: template
    name: "Capacidade da bateria"
    unit_of_measurement: "Ah"
    min_value: 10
    max_value: 3000
    step: 10
    mode: box
    lambda: "return id(battery_capacity_ah);"
    set_action:
      - globals.set:
          id: battery_capacity_ah
          value: !lambda "return x;"

  # Número para ajustar a eficiência do inversor usada no modelo equivalente (teste)
  - platform: template
    name: "Eficiência inversor"
    unit_of_measurement: "%"
    min_value: 70
    max_value: 99
    step: 1
    mode: box
    lambda: "return id(inverter_efficiency) * 100.0f;"
    set_action:
      - globals.set:
          id: inverter_efficiency
          value: !lambda "return x / 100.0f;"
    
