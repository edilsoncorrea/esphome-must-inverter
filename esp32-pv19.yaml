  - platform: modbus_controller
    address: 25273
    id: battery_power
    register_type: holding
    value_type: S_WORD
    # name: "Potência da bateria"
    name: "Battery power"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 111
    id: temp_battery
    register_type: holding
    name: "Battery temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1     

  - platform: modbus_controller
    address: 25274
    register_type: holding
    value_type: S_WORD
    # name: "Corrente da bateria"
    name: "Battery current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc

  # Autonomia estimada da bateria:
  #   Descarregando → horas restantes com base na descarga atual
  #   Na rede/carregando → horas teóricas com base na carga atual (load_power)
  #     = "se a rede cair agora, quanto tempo a bateria aguenta?"
  # No inversor MUST: battery_power > 0 = descarregando, < 0 = carregando/rede
  - platform: template
    name: "Autonomia da bateria"
    id: battery_time_remaining
    icon: mdi:battery-clock
    unit_of_measurement: "h"
    accuracy_decimals: 1
    lambda: |-
      float last_valid = id(battery_time_remaining).state;
      if (isnan(last_valid)) last_valid = 0.0f;
      float batt_w = id(battery_power).state;
      float soc_pct = id(soc).state;
      float v = id(battery_voltage).state;
      float cap_ah = id(battery_capacity_ah);
      float load_w = id(load_power).state;

      if (isnan(soc_pct) || isnan(v) || cap_ah < 1.0f) {
        return last_valid;
      }
      if (soc_pct < 0.0f) soc_pct = 0.0f;
      if (soc_pct > 100.0f) soc_pct = 100.0f;

      float remaining_wh = (soc_pct / 100.0f) * cap_ah * v;
      float ref_w = NAN;

      // Descarga real (convencao MUST: > 0).
      if (!isnan(batt_w)) {
        if (batt_w > 1.0f) {
          ref_w = batt_w;
        }
      }

      // Se nao houver descarga valida, usa carga atual para autonomia teorica.
      if (isnan(ref_w)) {
        if (isnan(load_w)) {
          return last_valid;
        }

        // Em rede/carregando, remove do consumo a parcela usada para carregar a bateria.
        float battery_charge_w = 0.0f;
        if (!isnan(batt_w) && batt_w < -1.0f) {
          battery_charge_w = fabsf(batt_w);
        }

        float net_house_w = load_w - battery_charge_w;
        if (net_house_w < 1.0f) {
          // Fallback: alguns modelos/reportes ja trazem load sem a parcela da bateria.
          if (load_w >= 1.0f) {
            ref_w = load_w;
          } else {
            return last_valid;
          }
        } else {
          ref_w = net_house_w;
        }
      }

      float autonomy_h = remaining_wh / ref_w;
      return autonomy_h;
    update_interval: 60s

  # Autonomia equivalente (teste):
  #   Converte carga AC líquida em demanda DC equivalente usando eficiência do inversor.
  #   Objetivo: aproximar "se cair a rede agora" sem depender do sinal de carga/descarga atual.
  - platform: template
    name: "Autonomia bateria equivalente"
    id: battery_time_remaining_equiv
    icon: mdi:battery-sync
    unit_of_measurement: "h"
    accuracy_decimals: 1
    lambda: |-
      float last_valid = id(battery_time_remaining_equiv).state;
      if (isnan(last_valid)) last_valid = 0.0f;

      float soc_pct = id(soc).state;
      float v_bat = id(battery_voltage).state;
      float cap_ah = id(battery_capacity_ah);
      float load_w = id(load_power).state;
      float eta = id(inverter_efficiency);

      if (isnan(soc_pct) || isnan(v_bat) || isnan(load_w)) {
        return last_valid;
      }
      if (cap_ah < 1.0f) {
        return last_valid;
      }
      if (eta < 0.70f || eta > 0.99f) {
        return last_valid;
      }

      if (soc_pct < 0.0f) soc_pct = 0.0f;
      if (soc_pct > 100.0f) soc_pct = 100.0f;
      if (load_w < 1.0f) {
        return last_valid;
      }

      float remaining_wh = (soc_pct / 100.0f) * cap_ah * v_bat;
      float dc_equivalent_w = load_w / eta;
      if (dc_equivalent_w < 1.0f) {
        return last_valid;
      }

      float autonomy_h = remaining_wh / dc_equivalent_w;
      return autonomy_h;
    update_interval: 60s

select:
  - platform: modbus_controller
    id: energy_use_mode
    # name: "Modo de uso de energia"
    name: "Energy use mode"
    address: 20109
    skip_updates: 3
    optionsmap:
      "SBU (Solar/battery/utility)": 1
      "SUB (Solar/utility/battery)": 2
      "UTI (Utility only)": 3
      "SOL (Solar only)": 4

  - platform: modbus_controller
    id: charger_source_priority
    # name: "Prioridade fonte carregador"
    name: "Charger source priority"
    address: 20143
    skip_updates: 3
    optionsmap:
      "CSO (Solar first)": 0        # select index 0
      "SNU (Solar and utility)": 2  # select index 1
      "OSO (Solar only)": 3         # select index 2

  - platform: modbus_controller
    id: solar_use_aim
    # name: "Objetivo uso solar"
    name: "Solar Use Aim"
    address: 20112
    skip_updates: 3
    optionsmap:
      "LBU (Load, Battery, Utility)": 0        # select index 0
      "BLU (Battery, Load, Utility)": 1        # select index 1

