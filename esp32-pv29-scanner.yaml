substitutions:
  device_name: "pv29-address-scanner"
  name: "pv29-address-scanner"
  tx_pin: GPIO19
  rx_pin: GPIO18

esphome:
  name: ${name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    uart: DEBUG
    modbus_controller: DEBUG
    modbus: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: mod_bus_must
  send_wait_time: 500ms

# Testa múltiplos endereços
modbus_controller:
  # Endereço 1
  - id: addr_1
    address: 0x1
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

  # Endereço 4 (padrão MUST)
  - id: addr_4
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

  # Endereço 10
  - id: addr_10
    address: 0x0A
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

  # Endereço 16
  - id: addr_16
    address: 0x10
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

  # Endereço 32
  - id: addr_32
    address: 0x20
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

sensor:
  # Tenta ler SOC em cada endereço
  - platform: modbus_controller
    modbus_controller_id: addr_1
    name: "SOC Address 1"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: addr_4
    name: "SOC Address 4"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: addr_10
    name: "SOC Address 10"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: addr_16
    name: "SOC Address 16"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: addr_32
    name: "SOC Address 32"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

text_sensor:
  - platform: template
    name: "Scanner Status"
    lambda: |-
      std::string status = "Testing addresses: 1,4,10,16,32\n";
      status += "Look for '<<<' in logs for response!\n";
      status += "If no response, try swapping A/B wires.";
      return status;
    update_interval: 30s
