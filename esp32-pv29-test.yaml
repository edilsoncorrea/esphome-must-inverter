substitutions:
  device_name: "must-pv29-test"
  name: "must-pv29-test"
  tx_pin: GPIO19
  rx_pin: GPIO18

esphome:
  name: ${name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    uart: DEBUG
    modbus_controller: DEBUG
    modbus: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: mod_bus_must
  send_wait_time: 500ms

# Teste com endereço 0x04 (4)
modbus_controller:
  - id: must_addr4
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 30s

sensor:
  # Tenta ler apenas um registro simples - SOC (State of Charge)
  - platform: modbus_controller
    modbus_controller_id: must_addr4
    name: "Test SOC Address 4"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

text_sensor:
  - platform: template
    name: "Connection Status Addr 4"
    lambda: |-
      if (id(must_addr4).is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s
