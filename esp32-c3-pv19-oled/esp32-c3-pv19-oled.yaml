substitutions:
  device_name: "must-inverter-c3-pv19-oled"
  name: "must-inverter-c3-pv19-oled"
  device_location: "Your location here"
  device_description: "Display OLED para inversor MUST PV19 via Home Assistant"
  i2c_sda: GPIO4
  i2c_scl: GPIO5
  # Entity IDs do Home Assistant — ajuste conforme os nomes na sua instalação
  # Padrão ESPHome: sensor.{device_name}_{sensor_name} (espaços viram _)
  ha_soc:            sensor.must_inverter_pv19_state_of_charge
  ha_inv_work_state: sensor.must_inverter_pv19_inverter_work_state
  ha_inv_voltage:    sensor.must_inverter_pv19_inverter_voltage
  ha_sys_load:       sensor.must_inverter_pv19_system_load
  ha_temp_ac_rad:    sensor.must_inverter_pv19_ac_radiator_temp
  ha_temp_battery:   sensor.must_inverter_pv19_battery_temp
  ha_bat_current:    sensor.must_inverter_pv19_battery_current

esphome:
  name: ${name}
  min_version: 2024.6.0
  comment: ${device_location}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

switch:
  - platform: restart
    name: "${device_name} restart"

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true

font:
  - file: "gfonts://Roboto"
    id: f11
    size: 11
  - file: "gfonts://Roboto"
    id: f10
    size: 10




# Os sensores são lidos do Home Assistant, que já os recebe
# do ESPHome conectado ao inversor via RS485.
# Ajuste os entity_id nas substitutions acima conforme sua instalação.
sensor:
  - platform: homeassistant
    id: soc
    entity_id: ${ha_soc}
    internal: true

  - platform: homeassistant
    id: inv_work_state
    entity_id: ${ha_inv_work_state}
    internal: true

  - platform: homeassistant
    id: inv_voltage
    entity_id: ${ha_inv_voltage}
    internal: true

  - platform: homeassistant
    id: sys_load
    entity_id: ${ha_sys_load}
    internal: true

  - platform: homeassistant
    id: temp_ac_rad
    entity_id: ${ha_temp_ac_rad}
    internal: true

  - platform: homeassistant
    id: temp_battery
    entity_id: ${ha_temp_battery}
    internal: true

  - platform: homeassistant
    id: bat_current
    entity_id: ${ha_bat_current}
    internal: true

# ─────────────────────────────────────────────────────────────────────────────
# DISPLAY OLED SSD1306 0.96" 128x64 I2C
#
# Layout (128x64 px, fonte tamanho 11):
#
#  y= 0  │ B:75%  +12A  [REDE] │  SOC + corrente bateria + fonte
#  y=13  │ Vs:110V   Carga:42% │  tensão saída AC + % carga inversor
#  y=26  │ Ti: 38C   Tb: 32C   │  temp inversor + temp bateria
#  y=41  │ [▓▓▓▓▓▓▓░░░]  75%  │  barra visual SOC (100px)
#
# Fonte [REDE/BAT] baseada no registrador 25201 (Inverter Work state):
#   3=Grid, 4=Bypass, 6=Grid Charging → REDE | demais → BAT
# ─────────────────────────────────────────────────────────────────────────────
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C   # alternativa: 0x3D
    update_interval: 5s
    lambda: |-
      // Aguarda dados válidos do Home Assistant (NaN = ainda não recebido)
      if (isnan(id(soc).state) || isnan(id(inv_work_state).state)) {
        it.print(0,  0, id(f11), "Aguardando");
        it.print(0, 16, id(f11), "Home Assistant...");
        return;
      }

      // Linha 1: SOC, corrente bateria (+ carregando / - descarregando), fonte
      int ws = (int)id(inv_work_state).state;
      const char* fonte = (ws == 3 || ws == 4 || ws == 6) ? "REDE" : "BAT ";
      it.printf(0,  0, id(f11), "B:%2.0f%% %+.0fA [%s]",
        id(soc).state, id(bat_current).state, fonte);

      // Linha 2: tensão saída inversor (110V) + % carga do sistema
      it.printf(0, 13, id(f11), "Vs:%.0fV   Carga:%2.0f%%",
        id(inv_voltage).state, id(sys_load).state);

      // Linha 3: temperatura do inversor (radiador AC) e da bateria
      it.printf(0, 26, id(f11), "Ti:%2.0fC   Tb:%2.0fC",
        id(temp_ac_rad).state, id(temp_battery).state);

      // Linha 4: barra de progresso visual do SOC
      // contorno: 102px largura x 12px altura
      it.rectangle(0, 41, 102, 12);
      // preenchimento proporcional ao SOC (1px a 100px)
      int bar = (int)id(soc).state;
      if (bar > 0) it.filled_rectangle(1, 42, bar, 10);
      // percentual numérico à direita da barra
      it.printf(106, 41, id(f10), "%2.0f%%", id(soc).state);
