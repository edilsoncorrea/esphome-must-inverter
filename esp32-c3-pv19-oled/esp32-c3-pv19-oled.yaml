substitutions:
  device_name: "must-inverter-c3-pv19"
  name: "must-inverter-c3-pv19"
  device_location: "Your location here"
  device_description: "Monitor MUST inverter via RS485 + OLED SSD1306"
  tx_pin: GPIO19
  rx_pin: GPIO18
  i2c_sda: GPIO4
  i2c_scl: GPIO5

esphome:
  name: ${name}
  min_version: 2024.6.0
  comment: ${device_location}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

switch:
  - platform: restart
    name: "${device_name} restart"

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true

font:
  - file: "gfonts://Roboto"
    id: f11
    size: 11
  - file: "gfonts://Roboto"
    id: f10
    size: 10

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8

modbus:
  id: mod_bus_must
  send_wait_time: 350ms

modbus_controller:
  - id: must
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 20s
    offline_skip_updates: 10
    command_throttle: 100ms

binary_sensor:
  # CE: - Charger Errors from 15213
  - platform: template
    name: "CE: Charger hardware protection"
    lambda: return ((uint16_t)id(charger_error_message).state >> 0) & 1;
  - platform: template
    name: "CE: Over current"
    lambda: return ((uint16_t)id(charger_error_message).state >> 1) & 1;
  - platform: template
    name: "CE: Current sensor error"
    lambda: return ((uint16_t)id(charger_error_message).state >> 2) & 1;
  - platform: template
    name: "CE: Over temperature"
    lambda: return ((uint16_t)id(charger_error_message).state >> 3) & 1;
  - platform: template
    name: "CE: PV voltage is too high"
    lambda: return ((uint16_t)id(charger_error_message).state >> 4) & 1;
  - platform: template
    name: "CE: PV voltage is too low"
    lambda: return ((uint16_t)id(charger_error_message).state >> 5) & 1;
  - platform: template
    name: "CE: Battery voltage is too high"
    lambda: return ((uint16_t)id(charger_error_message).state >> 6) & 1;
  - platform: template
    name: "CE: Battery voltage is too low"
    lambda: return ((uint16_t)id(charger_error_message).state >> 7) & 1;
  - platform: template
    name: "CE: Current is uncontrollable"
    lambda: return ((uint16_t)id(charger_error_message).state >> 8) & 1;
  - platform: template
    name: "CE: Parameter error"
    lambda: return ((uint16_t)id(charger_error_message).state >> 9) & 1;

  # CW: - Charger Warnings from 15214
  - platform: template
    name: "CW: Fan error"
    lambda: return ((uint16_t)id(charger_warning_message).state >> 0) & 1;

  # IE: - Inverter Errors from 25261
  - platform: template
    name: "IE: Fan is locked when inverter is off"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 0) & 1;
  - platform: template
    name: "IE: Inverter transformer over temperature"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 1) & 1;
  - platform: template
    name: "IE: Battery voltage is too high"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 2) & 1;
  - platform: template
    name: "IE: Battery voltage is too low"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 3) & 1;
  - platform: template
    name: "IE: Output short circuited"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 4) & 1;
  - platform: template
    name: "IE: Inverter output voltage is high"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 5) & 1;
  - platform: template
    name: "IE: Overload time out"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 6) & 1;
  - platform: template
    name: "IE: Inverter bus voltage is too high"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 7) & 1;
  - platform: template
    name: "IE: Bus soft start failed"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 8) & 1;
  - platform: template
    name: "IE: Main relay failed"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 9) & 1;
  - platform: template
    name: "IE: Inverter output voltage sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 10) & 1;
  - platform: template
    name: "IE: Inverter grid voltage sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 11) & 1;
  - platform: template
    name: "IE: Inverter output current sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 12) & 1;
  - platform: template
    name: "IE: Inverter grid current sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 13) & 1;
  - platform: template
    name: "IE: Inverter load current sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 14) & 1;
  - platform: template
    name: "IE: Inverter grid over current error"
    lambda: return ((uint16_t)id(inverter_error_message_1).state >> 15) & 1;

  # IE: - Inverter Errors from 25262
  - platform: template
    name: "IE: Inverter radiator over temperature"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 0) & 1;
  - platform: template
    name: "IE: Solar charger battery voltage class error"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 1) & 1;
  - platform: template
    name: "IE: Solar charger current sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 2) & 1;
  - platform: template
    name: "IE: Solar charger current is uncontrollable"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 3) & 1;
  - platform: template
    name: "IE: Inverter grid voltage is low"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 4) & 1;
  - platform: template
    name: "IE: Inverter grid voltage is high"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 5) & 1;
  - platform: template
    name: "IE: Inverter grid under frequency"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 6) & 1;
  - platform: template
    name: "IE: Inverter grid over frequency"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 7) & 1;
  - platform: template
    name: "IE: Inverter over current protection error"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 8) & 1;
  - platform: template
    name: "IE: Inverter bus voltage is too low"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 9) & 1;
  - platform: template
    name: "IE: Inverter soft start failed"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 10) & 1;
  - platform: template
    name: "IE: Over DC voltage in AC output"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 11) & 1;
  - platform: template
    name: "IE: Battery connection is open"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 12) & 1;
  - platform: template
    name: "IE: Inverter control current sensor error"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 13) & 1;
  - platform: template
    name: "IE: Inverter output voltage is too low"
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 14) & 1;
  - platform: template
    name: "IE: "
    lambda: return ((uint16_t)id(inverter_error_message_2).state >> 15) & 1;

  # IW: - Inverter Warnings from 25265
  - platform: template
    name: "IW: Fan is locked when inverter is on"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 0) & 1;
  - platform: template
    name: "IW: Fan2 is locked when inverter is on"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 1) & 1;
  - platform: template
    name: "IW: Battery is over-charged"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 2) & 1;
  - platform: template
    name: "IW: Low battery"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 3) & 1;
  - platform: template
    name: "IW: Overload"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 4) & 1;
  - platform: template
    name: "IW: Output power derating"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 5) & 1;
  - platform: template
    name: "IW: Solar charger stops due to low battery"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 6) & 1;
  - platform: template
    name: "IW: Solar charger stops due to high PV voltage"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 7) & 1;
  - platform: template
    name: "IW: Solar charger stops due to over load"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 8) & 1;
  - platform: template
    name: "IW: Solar charger over temperature"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 9) & 1;
  - platform: template
    name: "IW: PV charger communication error"
    lambda: return ((uint16_t)id(inverter_warning_message_1).state >> 10) & 1;


sensor:
  # --- Sensores usados no display ---
  - platform: modbus_controller
    address: 113
    id: soc
    name: "State of Charge"
    unit_of_measurement: "%"
    register_type: holding

  - platform: modbus_controller
    address: 25201
    id: inv_work_state
    register_type: holding
    name: "Inverter Work state"

  - platform: modbus_controller
    address: 25206
    id: inv_voltage
    name: "Inverter voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 25216
    id: sys_load
    name: "System load"
    register_type: holding
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 25233
    id: temp_ac_rad
    register_type: holding
    name: "AC radiator temp"
    accuracy_decimals: 1
    unit_of_measurement: "°C"

  # Temperatura da bateria (registrador 25269 - pode não estar disponível em todos os modelos)
  - platform: modbus_controller
    address: 25269
    id: temp_battery
    register_type: holding
    name: "Battery temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: modbus_controller
    address: 25274
    id: bat_current
    register_type: holding
    value_type: S_WORD
    name: "Battery current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc

  # --- Demais sensores ---
  - platform: modbus_controller
    address: 15201
    name: "Charger workstate"
    register_type: holding
    icon: mdi:battery-charging-50

  - platform: modbus_controller
    address: 15202
    name: "MPPT state"
    register_type: holding

  - platform: modbus_controller
    address: 15203
    name: "Charging state"
    register_type: holding

  - platform: modbus_controller
    id: inverter_error_message_1
    address: 25261
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_error_message_2
    address: 25262
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_error_message_3
    address: 25263
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_warning_message_1
    address: 25265
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_warning_message_2
    address: 25266
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: charger_error_message
    address: 15213
    bitmask: 0x3ff
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: charger_warning_message
    address: 15214
    register_type: holding
    internal: true

  - platform: modbus_controller
    address: 15205
    name: "PV1 voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 16205
    name: "PV2 voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15206
    name: "Battery voltage (charger side)"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15207
    name: "PV1 Charger Current"
    register_type: holding
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 16207
    name: "PV2 Charger Current"
    register_type: holding
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15208
    register_type: holding
    name: "PV1 Charger power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 16208
    register_type: holding
    name: "PV2 Charger power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 15211
    register_type: holding
    name: "Battery Relay"

  - platform: modbus_controller
    address: 15212
    register_type: holding
    name: "PV Relay"
    icon: mdi:electric-switch

  - platform: modbus_controller
    address: 15217
    register_type: holding
    id: charger_total_mwh
    internal: true

  - platform: modbus_controller
    address: 15218
    register_type: holding
    id: charger_total_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated charger power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(charger_total_mwh).state * 1000.0 + id(charger_total_kwh).state);

  - platform: modbus_controller
    address: 25205
    name: "Battery voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1
    on_value_range:
      - below: !lambda 'return id(inv_grid_chg_start).state;'
        then:
          - select.set_index:
              id: charger_source_priority
              index: 1  # SNU
      - above: !lambda 'return id(inv_grid_chg_stop).state;'
        then:
          - select.set_index:
              id: charger_source_priority
              index: 0  # SCO

  - platform: modbus_controller
    address: 25207
    name: "Grid voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 25213
    name: "Inverter power"
    register_type: holding
    unit_of_measurement: "W"
    accuracy_decimals: 1
    icon: mdi:flash
    value_type: S_WORD

  - platform: modbus_controller
    address: 25214
    name: "Grid power"
    register_type: holding
    unit_of_measurement: "W"
    accuracy_decimals: 1
    value_type: S_WORD
    icon: mdi:flash

  - platform: modbus_controller
    address: 25215
    name: "Load power"
    register_type: holding
    unit_of_measurement: "W"
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 25234
    register_type: holding
    name: "Transformer temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: modbus_controller
    address: 25235
    register_type: holding
    name: "DC Radiator temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: modbus_controller
    address: 25247
    register_type: holding
    id: discharger_total_mwh
    internal: true

  - platform: modbus_controller
    address: 25248
    register_type: holding
    id: discharger_total_kwh
