    register_type: holding
    id: inv_charger_total_mwh
    internal: true

  - platform: modbus_controller
    address: 25246
    register_type: holding
    id: inv_charger_total_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated INV charger power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(inv_charger_total_mwh).state * 1000.0 + id(inv_charger_total_kwh).state);

  - platform: modbus_controller
    address: 25249
    register_type: holding
    id: buy_mwh
    internal: true

  - platform: modbus_controller
    address: 25250
    register_type: holding
    id: buy_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated buy power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(buy_mwh).state * 1000.0 + id(buy_kwh).state);

  - platform: modbus_controller
    address: 25251
    register_type: holding
    id: sell_mwh

  - platform: modbus_controller
    address: 25252
    register_type: holding
    id: sell_kwh
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated sell power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(sell_mwh).state * 1000.0 + id(sell_kwh).state);

  - platform: modbus_controller
    address: 25253
    register_type: holding
    id: load_mwh
    internal: true

  - platform: modbus_controller
    address: 25254
    register_type: holding
    id: load_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated load power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(load_mwh).state * 1000.0 + id(load_kwh).state);

  - platform: modbus_controller
    address: 25259
    register_type: holding
    id: grid_charge_mwh
    internal: true

  - platform: modbus_controller
    address: 25260
    register_type: holding
    id: grid_charge_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated grid charge power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    lambda: |-
      return (id(grid_charge_mwh).state * 1000.0 + id(grid_charge_kwh).state);

  - platform: modbus_controller
    address: 25273
    register_type: holding
    value_type: S_WORD
    name: "Battery power"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    icon: mdi:flash

select:
  - platform: modbus_controller
    id: energy_use_mode
    name: "Energy use mode"
    address: 20109
    skip_updates: 3
    optionsmap:
      "SBU (Solar/battery/utility)": 1
      "SUB (Solar/utility/battery)": 2
      "UTI (Utility only)": 3
      "SOL (Solar only)": 4

  - platform: modbus_controller
    id: charger_source_priority
    name: "Charger source priority"
    address: 20143
    skip_updates: 3
    optionsmap:
      "CSO (Solar first)": 0
      "SNU (Solar and utility)": 2
      "OSO (Solar only)": 3

  - platform: modbus_controller
    id: solar_use_aim
    name: "Solar Use Aim"
    address: 20112
    skip_updates: 3
    optionsmap:
      "LBU (Load, Battery, Utility)": 0
      "BLU (Battery, Load, Utility)": 1

number:
  - platform: template
    name: "INV Enable grid charge"
    id: inv_grid_chg_start
    device_class: voltage
    unit_of_measurement: "V"
    min_value: 48
    max_value: 58.4
    initial_value: 51
    step: 0.1
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "INV Disable grid charge"
    id: inv_grid_chg_stop
    device_class: voltage
    unit_of_measurement: "V"
    min_value: 48
    max_value: 58.4
    initial_value: 53
    step: 0.1
    optimistic: true
    restore_value: true
    mode: box

  - platform: modbus_controller
    id: batt_float_voltage
    name: "Float voltage"
    unit_of_measurement: "V"
    address: 10103
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: batt_absorb_voltage
    name: "Absorb voltage"
    unit_of_measurement: "V"
    address: 10104
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: batt_stop_dischg
    name: "Battery stop discharging voltage"
    unit_of_measurement: "V"
    address: 20118
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: batt_stop_chg
    name: "Battery stop charging voltage"
    unit_of_measurement: "V"
    address: 20119
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: batt_low_voltage
    name: "Battery low voltage"
    unit_of_measurement: "V"
    address: 20127
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: batt_high_voltage
    name: "Battery high voltage"
    unit_of_measurement: "V"
    address: 20128
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    name: "Max Grid Charger current"
    unit_of_measurement: "A"
    address: 20125
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    name: "Max Combine Charger current"
    unit_of_measurement: "A"
    address: 20132
    value_type: U_WORD
    skip_updates: 3
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  - platform: modbus_controller
    id: system_settings
    address: 20142
    value_type: U_WORD
    internal: true

# ─────────────────────────────────────────────────────────────────────────────
# DISPLAY OLED SSD1306 0.96" 128x64 I2C
#
# Layout (128x64 px, fonte tamanho 11):
#
#  y= 0  │ B:75%  +12A  [REDE] │  SOC + corrente bateria + fonte
#  y=13  │ Vs:110V   Carga:42% │  tensão saída AC + % carga inversor
#  y=26  │ Ti: 38C   Tb: 32C   │  temp inversor + temp bateria
#  y=41  │ [▓▓▓▓▓▓▓░░░]  75%  │  barra visual SOC (100px)
#
# Fonte [REDE/BAT] baseada no registrador 25201 (Inverter Work state):
#   3=Grid, 4=Bypass, 6=Grid Charging → REDE | demais → BAT
# ─────────────────────────────────────────────────────────────────────────────
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C   # alternativa: 0x3D
    update_interval: 5s
    lambda: |-
      // Linha 1: SOC, corrente bateria (+ carregando / - descarregando), fonte
      int ws = (int)id(inv_work_state).state;
      const char* fonte = (ws == 3 || ws == 4 || ws == 6) ? "REDE" : "BAT ";
      it.printf(0,  0, id(f11), "B:%2.0f%% %+.0fA [%s]",
        id(soc).state, id(bat_current).state, fonte);

      // Linha 2: tensão saída inversor (110V) + % carga do sistema
      it.printf(0, 13, id(f11), "Vs:%.0fV   Carga:%2.0f%%",
        id(inv_voltage).state, id(sys_load).state);

      // Linha 3: temperatura do inversor (radiador AC) e da bateria
      it.printf(0, 26, id(f11), "Ti:%2.0fC   Tb:%2.0fC",
        id(temp_ac_rad).state, id(temp_battery).state);

      // Linha 4: barra de progresso visual do SOC
      // contorno: 102px largura x 12px altura
      it.rectangle(0, 41, 102, 12);
      // preenchimento proporcional ao SOC (1px a 100px)
      int bar = (int)id(soc).state;
      if (bar > 0) it.filled_rectangle(1, 42, bar, 10);
      // percentual numérico à direita da barra
      it.printf(106, 41, id(f10), "%2.0f%%", id(soc).state);
