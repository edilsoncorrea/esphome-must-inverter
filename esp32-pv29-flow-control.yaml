substitutions:
  device_name: "pv29-flow-control"
  name: "pv29-flow-control"
  tx_pin: GPIO19
  rx_pin: GPIO18
  flow_control_pin: GPIO3  # D3 no ESP32 DevKit - controla DE/RE

esphome:
  name: ${name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    uart: DEBUG
    modbus_controller: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  # Flow control - controla DE/RE via GPIO
  # HIGH = Transmit, LOW = Receive
  flow_control_pin: ${flow_control_pin}
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: mod_bus_must
  send_wait_time: 500ms

modbus_controller:
  - id: pv29
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

sensor:
  # Teste básico com flow control
  - platform: modbus_controller
    name: "Machine Type"
    address: 10001
    register_type: holding

  - platform: modbus_controller
    name: "Hardware Version"
    address: 10004
    register_type: holding

  - platform: modbus_controller
    name: "Software Version"
    address: 10005
    register_type: holding

  - platform: modbus_controller
    name: "PV Voltage"
    address: 15205
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  - platform: modbus_controller
    name: "Battery Voltage"
    address: 15206
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  - platform: modbus_controller
    name: "Inverter Work State"
    address: 25201
    register_type: holding

  - platform: modbus_controller
    name: "Load Power"
    address: 25215
    register_type: holding
    unit_of_measurement: "W"

text_sensor:
  - platform: template
    name: "Config Info"
    lambda: |-
      return {"PV2900 - Address 4 - Flow Control: GPIO3"};
    update_interval: 60s
