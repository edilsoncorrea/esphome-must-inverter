substitutions:
  device_name: "pv29-basic-test"
  name: "pv29-basic-test"
  tx_pin: GPIO19
  rx_pin: GPIO18

esphome:
  name: ${name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    uart: DEBUG
    modbus_controller: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: mod_bus_must
  send_wait_time: 500ms

modbus_controller:
  - id: pv29
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 60s

sensor:
  # Registros básicos da documentação PV18
  # Testa se PV29 usa os mesmos registros
  
  # 10001 - Machine Type
  - platform: modbus_controller
    name: "Machine Type"
    address: 10001
    register_type: holding

  # 10004 - Hardware Version
  - platform: modbus_controller
    name: "Hardware Version"
    address: 10004
    register_type: holding

  # 10005 - Software Version
  - platform: modbus_controller
    name: "Software Version"
    address: 10005
    register_type: holding

  # 15201 - Charger Work State
  - platform: modbus_controller
    name: "Charger Work State"
    address: 15201
    register_type: holding

  # 15205 - PV Voltage
  - platform: modbus_controller
    name: "PV Voltage"
    address: 15205
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  # 15206 - Battery Voltage (Charger)
  - platform: modbus_controller
    name: "Battery Voltage Charger"
    address: 15206
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  # 25201 - Inverter Work State
  - platform: modbus_controller
    name: "Inverter Work State"
    address: 25201
    register_type: holding

  # 25205 - Battery Voltage (Inverter)
  - platform: modbus_controller
    name: "Battery Voltage Inverter"
    address: 25205
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  # 25215 - Load Power
  - platform: modbus_controller
    name: "Load Power"
    address: 25215
    register_type: holding
    unit_of_measurement: "W"

text_sensor:
  - platform: template
    name: "Test Info"
    lambda: |-
      return {"PV2900 Protocol 6422 Test - Look for <<< in logs!"};
    update_interval: 60s
