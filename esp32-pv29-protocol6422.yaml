substitutions:
  device_name: "pv29-protocol-6422"
  name: "pv29-protocol-6422"
  tx_pin: GPIO19
  rx_pin: GPIO18

esphome:
  name: ${name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    uart: DEBUG
    modbus_controller: DEBUG
    modbus: DEBUG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          UARTDebug::log_hex(direction, bytes, ':');

modbus:
  id: mod_bus_must
  send_wait_time: 500ms

modbus_controller:
  - id: pv29
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 30s
    command_throttle: 200ms

sensor:
  # Tenta registros mais comuns/básicos do protocolo 6422
  # Registro 0 - pode conter informação básica
  - platform: modbus_controller
    name: "PV29 Register 0"
    address: 0
    register_type: holding

  # Registro 1 - pode conter versão ou status
  - platform: modbus_controller
    name: "PV29 Register 1"
    address: 1
    register_type: holding

  # Registro 10 - testa área comum
  - platform: modbus_controller
    name: "PV29 Register 10"
    address: 10
    register_type: holding

  # Registro 100 - área comum de dados
  - platform: modbus_controller
    name: "PV29 Register 100"
    address: 100
    register_type: holding

  # Registro 113 (SOC usado nos PV18/19)
  - platform: modbus_controller
    name: "PV29 Register 113 (SOC Test)"
    address: 113
    register_type: holding
    unit_of_measurement: "%"

  # Registro 1000 - área de dados
  - platform: modbus_controller
    name: "PV29 Register 1000"
    address: 1000
    register_type: holding

  # Input registers também podem ser usados
  - platform: modbus_controller
    name: "PV29 Input Register 0"
    address: 0
    register_type: read

  - platform: modbus_controller
    name: "PV29 Input Register 1"
    address: 1
    register_type: read

text_sensor:
  - platform: template
    name: "Protocol Info"
    lambda: |-
      return {"PV2900 5kW - Protocol 6422 - Address 4"};
    update_interval: 60s
